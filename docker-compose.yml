version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: participation_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: participation_arch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d participation_arch"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: participation_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/participation_arch
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: