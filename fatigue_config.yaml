# Delegate Fatigue Index (DFI) Configuration
# Version follows SemVer - increment when changing weights or thresholds
#
# Theoretical grounding:
#   - Volume:       "kolektywna uwaga" as rivalrous commons resource (dissertation 2.3.1)
#   - Concurrency:  "paraliż decyzyjny" from simultaneous proposals (dissertation 2.3.1)
#   - Burstiness:   habit disruption per Fogg B=MAP model (dissertation 2.2.1)
#   - Reading Time: Fogg Ability reduction via cognitive cost (dissertation 2.2.1)
#   - Novelty:      novel vs. routine cognitive processing cost (CLT, dissertation 1.4)
#
# Formula:
#   DFI = (w_volume×volume + w_concurrency×concurrency + w_burstiness×burstiness
#          + w_reading_time×reading_time + w_novelty×novelty) × 100

version: "1.0.0"

# Component weights (must sum to 1.0)
weights:
  volume: 0.40        # Dominant driver - volume of governance work over time
  concurrency: 0.25   # Simultaneous active proposals create parallel decision pressure
  burstiness: 0.20    # Spikes disrupt regularity needed for habit formation
  reading_time: 0.10  # Cognitive cost proxy via word count
  novelty: 0.05       # Novel domains require more cognitive effort than routine items

# Reference values: what counts as "normal" governance load
# These are calibrated for Arbitrum-scale governance (adjust per DAO)
reference_values:
  volume_7d: 5        # proposals/week considered normal (1/day)
  volume_30d: 20      # proposals/month considered normal
  concurrent: 5       # simultaneous active votes considered normal
  reading_words: 3000 # word count considered normal proposal length
                      # ~15 min reading at 200 wpm

# Reference values for the PER-EVENT variant (compute_per_event).
# Unit of analysis: a SINGLE vote (most recent vote), per the 2026-05-11
# per-event pivot (NASA-TLX is task-specific, validated only up to 24h -
# Hernandez 2021; dissertation L5 + 5.3.5a). DFI is matched to the vote via
# as_of = vote timestamp.
#   - reading_time: length of THE voted proposal (intrinsic load)
#   - volume/concurrency/burstiness: delegate's context around the vote
# CALIBRATED 2026-06-02 on real Arbitrum data (Snapshot):
#   proposal length median ~1404 words; votes/delegate median 2/30d, max 5/90d.
# Reference values are the denominator of each context component, and the
# component is clipped at 1.0. A reference set below ordinary activity therefore
# pins the component at its ceiling for everyone and removes it from the scale.
#
# The previous set did exactly that. Measured on the field (arbdata + Snapshot,
# 14 delegates, 2797 vote events, 2026-08-05): the MEDIAN delegate casts 3 votes
# a week, so volume_7d = 1 saturated a component carrying 40% of the weight for
# anyone at a third of median activity. Volume and reading_time sat at 1.0 for
# all three Phase A participants, leaving half the scale constant and the whole
# between-delegate spread at 8.1 points out of 100.
#
# These are the 75th percentile of the field's own distribution, produced by
# pa/analiza/kalibracja-referencji.py. The percentile was picked by measurement,
# not by taste - the criterion is that the MEDIAN delegate lands mid-range on
# each component, leaving room in both directions:
#   p90 (volume_7d = 17) puts the median at 3/17 = 0.18, so everyone crowds the
#     floor. The three Phase A participants scored 18.9 / 18.1 / 22.0, spread 3.9.
#   p75 (volume_7d = 7) puts the median at 3/7 = 0.43. Same participants:
#     24.7 / 22.6 / 29.1, spread 6.5.
#   the old set (volume_7d = 1) put the median at the ceiling, which is where the
#     saturation came from in the first place.
#
# What no reference value can fix: the spread between delegates comes from the
# delegates differing, not from the denominator. These three are similarly active
# and rated the same proposal within one week, so a narrow spread here says more
# about the sample than about the instrument. H_val needs N=50 with varied load.
#
# Re-run the script when the field site changes - these numbers describe
# Arbitrum, and a constant tuned here would carry the same defect to the next DAO.
#
# Caveat recorded with the values: the calibration sample was drawn from recent
# Snapshot voters, so it leans toward currently active delegates and does not yet
# include the treasury governor votes that the engine reads since 2026-08-05.
# Both biases understate activity, so these references are a floor, not a final
# answer.
reference_values_per_event:
  volume_7d: 7        # p75 of votes in 7 days (field median 3)
  volume_30d: 18      # p75 of votes in 30 days (field median 9)
  concurrent: 6       # p75 of proposals open at once (field median 2)
  reading_words: 710  # p75 proposal length halved - the formula divides by 2
                      # again (field median 730 words, not the assumed 1500)

# Status thresholds (score 0-100). These are WORKLOAD bands, nothing more.
#
# The top band used to read "burnout risk per SDT framework". Raised in the
# source-level review on the forum (2026-08-03, cxclrfx) and correct: NASA-TLX
# measures workload on a task, and this index estimates observable load around a
# vote. Neither establishes burnout. That claim needs a longitudinal outcome and
# its own measurement contract - in this work it is hypothesis H1 (need
# frustration predicting a delegate going quiet for 60 days), which is
# exploratory at N=50 and not something a threshold in a config file can assert.
#
# A band label is read as a finding by anyone who sees the panel, so it has to
# stay inside what the instrument can support.
thresholds:
  low: 30        # 0-29:  LOW      - manageable governance load
  moderate: 70   # 30-69: MODERATE - elevated but sustainable
  high: 85       # 70-84: HIGH     - significant cognitive burden
                 # 85+:   CRITICAL - highest observed workload band

# Keywords used to classify proposals as novel vs. routine for the novelty component.
# Novel = genuinely new decision types requiring extra cognitive effort.
# Routine = recurring, familiar patterns with lower processing cost.
novel_keywords:
  - "exploit"
  - "hack"
  - "drain"
  - "vulnerability"
  - "hard fork"
  - "upgrade"
  - "emergency"
  - "pause"
  - "security council"
  - "arbitrum improvement"
  - "new program"
  - "pilot"
  - "initiative"
  - "constitution"
  - "amendment"

routine_keywords:
  - "report"
  - "transparency"
  - "renewal"
  - "housekeeping"
  - "maintenance"
  - "salary"
  - "stipend"
  - "compensation"
  - "monthly"
  - "quarterly"
  - "routine"
  - "operational"
