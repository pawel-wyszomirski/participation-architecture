version: 1.0.0

metadata:
  owner: "Participation Architecture"
  created_at: "2026-02-02"
  default_locale: "en"
  notes: "Deterministic triage rules. No ML/LLM inference."
  description: "Rule engine for governance proposal prioritization and delegate fatigue mitigation"

# Keyword groups for deterministic text matching (case-insensitive)
keyword_groups:
  SECURITY_CUES:
    - "exploit"
    - "vulnerability"
    - "attack"
    - "incident"
    - "hack"
    - "emergency"
    - "critical"
    - "cve"
    - "post-mortem"
    - "drain"
    - "compromise"
    - "security patch"
  
  UPGRADE_CUES:
    - "upgrade"
    - "deploy"
    - "migration"
    - "hard fork"
    - "soft fork"
    - "release"
    - "version"
    - "audit"
    - "timelock"
    - "rollup"
    - "sequencer"
  
  PARAMETER_CUES:
    - "parameter"
    - "config"
    - "fee"
    - "gas"
    - "limit"
    - "threshold"
    - "quorum"
    - "timelock"
    - "delay"
    - "rate"
    - "slippage"
    - "oracle"
  
  TREASURY_CUES:
    - "budget"
    - "funding"
    - "grant"
    - "allocate"
    - "allocation"
    - "usd"
    - "$"
    - "arb"
    - "treasury"
    - "payment"
    - "stream"
    - "invoice"
    - "retro"
  
  ELECTION_CUES:
    - "election"
    - "nomination"
    - "candidate"
    - "term"
    - "delegate council"
    - "committee"
    - "appoint"
    - "remove"
    - "renew"
  
  REPORTING_CUES:
    - "weekly"
    - "monthly"
    - "report"
    - "update"
    - "retrospective"
    - "summary"
    - "status"
    - "metrics"
    - "dashboard"
  
  OPS_CUES:
    - "housekeeping"
    - "admin"
    - "operational"
    - "maintenance"
    - "process"
    - "procedure"
    - "renewal"
    - "extension"
    - "calendar"
  
  GOV_FRAMEWORK_CUES:
    - "constitution"
    - "charter"
    - "framework"
    - "aip"
    - "sos"
    - "bylaws"
  
  VOTING_PROCEDURE_CUES:
    - "quorum"
    - "voting procedure"
    - "threshold"

# Score bands mapping to recommended handling
score_mapping:
  urgent_deep_review:
    min: 90
    max: 100
    description: "Immediate attention; notify delegates/builders; highlight deadlines"
  
  deep_review:
    min: 75
    max: 89
    description: "Allocate focused reading time; seek subject-matter input"
  
  standard_review:
    min: 50
    max: 74
    description: "Normal workflow; may be grouped in weekly digest"
  
  fast_track_ok:
    min: 25
    max: 49
    description: "Safe to batch; quick vote/checklist"
  
  informational_only:
    min: 0
    max: 24
    description: "Archive/record; optional reading"

# Treasury magnitude tiers (Section 6.2)
treasury_tiers_usd:
  - min_usd: 10000000
    add_priority: 20
    set_min_priority: 85
    label: "TREASURY_TIER_1"
    description: "≥$10M allocation"
  
  - min_usd: 1000000
    add_priority: 15
    set_min_priority: 75
    label: "TREASURY_TIER_2"
    description: "≥$1M allocation"
  
  - min_usd: 100000
    add_priority: 10
    set_min_priority: 65
    label: "TREASURY_TIER_3"
    description: "≥$100K allocation"
  
  - min_usd: 10000
    add_priority: 5
    set_min_priority: 55
    label: "TREASURY_TIER_4"
    description: "≥$10K allocation"

# Time sensitivity tiers (Section 6.3)
time_sensitivity_tiers:
  - max_hours_remaining: 24
    add_priority: 15
    description: "≤24h until deadline"
  
  - max_hours_remaining: 48
    add_priority: 10
    description: "≤48h until deadline"
  
  - max_hours_remaining: 72
    add_priority: 5
    description: "≤72h until deadline"

# Workload/length tiers (Section 6.4)
workload_tiers:
  - min_word_count: 3000
    add_priority: 10
    description: "Long form (≥3000 words)"
  
  - min_word_count: 1500
    add_priority: 6
    description: "Medium form (≥1500 words)"
  
  - min_word_count: 800
    add_priority: 3
    description: "Standard form (≥800 words)"

# Core triage rules (Section 8)
rules:
  # ========================================
  # SECURITY RULES (SEC-*)
  # ========================================
  
  - id: "SEC-001"
    name: "Emergency / incident / exploit cues"
    category: "SECURITY"
    priority: 1000
    when:
      any:
        - keyword_group_hits:
            group: "SECURITY_CUES"
            gte: 2
        - all:
            - keyword_group_hits:
                group: "SECURITY_CUES"
                gte: 1
            - keyword_group_hits:
                group: "UPGRADE_CUES"
                gte: 1
    then:
      add_labels: ["SECURITY", "INCIDENT", "EMERGENCY"]
      set_min_priority: 90
      add_priority: 10
      set_recommended_handling: "urgent_deep_review"
    rationale: "Any credible security cue should be escalated immediately"
  
  - id: "SEC-002"
    name: "Audit / vulnerability disclosure"
    category: "SECURITY"
    priority: 999
    when:
      all:
        - keyword_contains:
            keywords: ["audit"]
            min_hits: 1
        - keyword_contains:
            keywords: ["vulnerability", "critical"]
            min_hits: 1
    then:
      add_labels: ["SECURITY", "AUDIT"]
      set_min_priority: 85
      add_priority: 5
    rationale: "Security posture changes require focused review"
  
  # ========================================
  # PROTOCOL/PARAMETER RULES (TECH-*)
  # ========================================
  
  - id: "TECH-010"
    name: "Protocol upgrade"
    category: "TECHNICAL"
    priority: 900
    when:
      any:
        - keyword_group_hits:
            group: "UPGRADE_CUES"
            gte: 2
        - field_equals:
            field: "proposal_kind"
            value: "technical"
    then:
      add_labels: ["PROTOCOL_UPGRADE"]
      set_min_priority: 80
      add_priority: 5
    rationale: "Upgrades can affect system safety and operations"
  
  - id: "TECH-011"
    name: "Parameter change"
    category: "TECHNICAL"
    priority: 890
    when:
      any:
        - keyword_group_hits:
            group: "PARAMETER_CUES"
            gte: 2
        - field_equals:
            field: "affects_protocol_parameters"
            value: true
    then:
      add_labels: ["PARAMETER_CHANGE"]
      set_min_priority: 75
      add_priority: 5
    rationale: "Parameter shifts can change incentives/risk"
  
  # ========================================
  # TREASURY RULES (TRE-*)
  # ========================================
  
  - id: "TRE-020"
    name: "Treasury spend (amount known)"
    category: "TREASURY"
    priority: 800
    when:
      field_exists:
        field: "requested_amount_usd"
    then:
      add_labels: ["TREASURY"]
      apply_treasury_tiers_usd: true
    rationale: "Larger allocations require more scrutiny"
  
  - id: "TRE-021"
    name: "Treasury cues (amount unknown)"
    category: "TREASURY"
    priority: 790
    when:
      all:
        - keyword_group_hits:
            group: "TREASURY_CUES"
            gte: 2
        - field_not_exists:
            field: "requested_amount_usd"
    then:
      add_labels: ["TREASURY", "BUDGET"]
      set_min_priority: 55
      add_priority: 5
    rationale: "Budget-like proposals deserve baseline attention even without parsed amounts"
  
  # ========================================
  # GOVERNANCE FRAMEWORK RULES (GOV-*)
  # ========================================
  
  - id: "GOV-030"
    name: "Constitutional / framework change"
    category: "GOVERNANCE"
    priority: 700
    when:
      any:
        - field_equals:
            field: "proposal_kind"
            value: "constitutional"
        - keyword_group_hits:
            group: "GOV_FRAMEWORK_CUES"
            gte: 2
    then:
      add_labels: ["GOVERNANCE_FRAMEWORK"]
      set_min_priority: 70
      add_priority: 5
    rationale: "Process/constitution changes have long-term impact"
  
  - id: "GOV-031"
    name: "Quorum / voting procedure changes"
    category: "GOVERNANCE"
    priority: 690
    when:
      all:
        - keyword_group_hits:
            group: "PARAMETER_CUES"
            gte: 2
        - keyword_group_hits:
            group: "VOTING_PROCEDURE_CUES"
            gte: 1
    then:
      add_labels: ["GOVERNANCE_FRAMEWORK", "POLICY"]
      set_min_priority: 75
      add_priority: 5
    rationale: "Decision mechanics are core governance"
  
  # ========================================
  # ELECTIONS RULES (ELE-*)
  # ========================================
  
  - id: "ELE-040"
    name: "Elections / nominations"
    category: "ELECTIONS"
    priority: 650
    when:
      any:
        - keyword_group_hits:
            group: "ELECTION_CUES"
            gte: 2
        - field_equals:
            field: "proposal_kind"
            value: "election"
    then:
      add_labels: ["ELECTIONS"]
      set_min_priority: 65
      add_priority: 5
    rationale: "Leadership/roles affect execution capacity"
  
  # ========================================
  # OPERATIONS & REPORTING RULES (OPS-*, REP-*)
  # ========================================
  
  - id: "OPS-050"
    name: "Operational / administrative"
    category: "OPERATIONS"
    priority: 400
    when:
      any:
        - keyword_group_hits:
            group: "OPS_CUES"
            gte: 2
        - field_equals:
            field: "proposal_kind"
            value: "ops"
    then:
      add_labels: ["OPERATIONS"]
      set_max_priority: 40
      add_priority: 0
    rationale: "Many ops items can be fast-tracked"
  
  - id: "REP-060"
    name: "Reporting / status update"
    category: "REPORTING"
    priority: 300
    when:
      any:
        - keyword_group_hits:
            group: "REPORTING_CUES"
            gte: 2
        - title_contains:
            keywords: ["weekly update", "monthly report"]
            min_hits: 1
    then:
      add_labels: ["REPORTING"]
      set_max_priority: 30
    rationale: "Informational items should not crowd high-impact work"
  
  - id: "META-070"
    name: "Meta discussion / temperature check"
    category: "META_GOVERNANCE"
    priority: 500
    when:
      any:
        - field_equals:
            field: "item_type"
            value: "discussion"
        - title_contains:
            keywords: ["temperature check"]
            min_hits: 1
    then:
      add_labels: ["META_GOV"]
      set_max_priority: 50
    rationale: "Useful context, typically not urgent execution"
  
  # ========================================
  # TIME SENSITIVITY MODIFIERS (TIME-*)
  # ========================================
  
  - id: "TIME-001"
    name: "Critical deadline (≤24h)"
    category: "TIME_MODIFIER"
    priority: 100
    when:
      all:
        - field_equals:
            field: "status"
            value: "active"
        - time_remaining:
            max_hours: 24
    then:
      add_priority: 15
    rationale: "Urgent attention needed before deadline"
  
  - id: "TIME-002"
    name: "Near deadline (≤48h)"
    category: "TIME_MODIFIER"
    priority: 99
    when:
      all:
        - field_equals:
            field: "status"
            value: "active"
        - time_remaining:
            max_hours: 48
            min_hours: 24
    then:
      add_priority: 10
    rationale: "Approaching deadline"
  
  - id: "TIME-003"
    name: "Upcoming deadline (≤72h)"
    category: "TIME_MODIFIER"
    priority: 98
    when:
      all:
        - field_equals:
            field: "status"
            value: "active"
        - time_remaining:
            max_hours: 72
            min_hours: 48
    then:
      add_priority: 5
    rationale: "Deadline within 3 days"
  
  - id: "TIME-010"
    name: "Closed proposal cap (non-incident)"
    category: "TIME_MODIFIER"
    priority: 50
    when:
      all:
        - field_in:
            field: "status"
            values: ["closed", "executed"]
        - not_labeled: ["INCIDENT", "REPORTING"]
    then:
      set_max_priority: 50
    rationale: "Historical items have lower urgency unless incident-related"
  
  - id: "TIME-011"
    name: "Closed reporting cap"
    category: "TIME_MODIFIER"
    priority: 49
    when:
      all:
        - field_in:
            field: "status"
            values: ["closed", "executed"]
        - has_label: "REPORTING"
    then:
      set_max_priority: 30
    rationale: "Past reports are informational only"
  
  - id: "TIME-012"
    name: "Closed incident minimum"
    category: "TIME_MODIFIER"
    priority: 51
    when:
      all:
        - field_in:
            field: "status"
            values: ["closed", "executed"]
        - has_label: "INCIDENT"
    then:
      set_min_priority: 70
    rationale: "Past incidents remain high priority for analysis"
  
  # ========================================
  # WORKLOAD/LENGTH MODIFIERS (LEN-*)
  # ========================================
  
  - id: "LEN-001"
    name: "Long form content"
    category: "WORKLOAD_MODIFIER"
    priority: 10
    when:
      word_count:
        gte: 3000
    then:
      add_priority: 10
      add_labels: ["LONG_FORM"]
    rationale: "Extensive content requires significant reading time"
  
  - id: "LEN-002"
    name: "Medium form content"
    category: "WORKLOAD_MODIFIER"
    priority: 9
    when:
      word_count:
        gte: 1500
        lt: 3000
    then:
      add_priority: 6
      add_labels: ["MEDIUM_FORM"]
    rationale: "Moderate reading time required"
  
  - id: "LEN-003"
    name: "Standard form content"
    category: "WORKLOAD_MODIFIER"
    priority: 8
    when:
      word_count:
        gte: 800
        lt: 1500
    then:
      add_priority: 3
      add_labels: ["STANDARD_FORM"]
    rationale: "Standard reading time"

# Special overrides
overrides:
  # Any item labeled SECURITY must be urgent_deep_review
  - condition:
      has_label: "SECURITY"
    force:
      recommended_handling: "urgent_deep_review"
    rationale: "Security issues always require immediate attention"

# Evaluation order (fixed sequence)
evaluation_order:
  - "label_rules"           # Apply all label rules first
  - "base_priority_rules"   # Set minimums/maximums/points
  - "time_modifiers"        # Apply time-based adjustments
  - "workload_modifiers"    # Apply length-based adjustments
  - "clamp_score"           # Clamp to 0-100 range
  - "apply_overrides"       # Force overrides (e.g., SECURITY)
  - "map_handling"          # Map score to recommended_handling

# Conflict resolution strategy
conflict_resolution:
  min_priority: "max"  # Take maximum of all set_min_priority values
  max_priority: "min"  # Take minimum of all set_max_priority values
  labels: "additive"   # Labels accumulate
  priority_caps: "caps_win"  # If both add_priority and set_max_priority, cap wins
