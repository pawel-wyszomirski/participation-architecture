[pytest]
# Pytest configuration for Participation Architecture

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Verbosity and output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    security: Tests for security rules (SEC-*)
    treasury: Tests for treasury rules (TRE-*)
    technical: Tests for technical rules (TECH-*)
    governance: Tests for governance rules (GOV-*)
    elections: Tests for elections rules (ELE-*)
    operations: Tests for operations rules (OPS-*, REP-*, META-*)
    modifiers: Tests for time/workload modifiers
    conflict: Tests for conflict resolution
    edge: Tests for edge cases
    slow: Tests that take longer to run

# Console output styling
console_output_style = progress

# Minimum Python version
minversion = 3.11
